<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Under Construction</title>
    <style>
        :root {
            --bg: #0f1724;
            --card: #0b1220;
            --accent: #7dd3fc;
            --muted: #94a3b8;
        }
        html,body {
            height: 100%;
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: radial-gradient(1000px 400px at 10% 20%, rgba(125,211,252,0.06), transparent),
                                    radial-gradient(800px 300px at 90% 80%, rgba(125,211,252,0.03), transparent),
                                    var(--bg);
            color: #e6eef8;
        }
        .center {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
        }
        .card {
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.04);
            padding: 2.25rem;
            border-radius: 12px;
            text-align: center;
            max-width: 680px;
            width: 100%;
            box-shadow: 0 6px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
        }
        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            letter-spacing: -0.02em;
            color: #ffffff;
        }
        p.lead {
            margin: 0 0 1.25rem 0;
            color: var(--muted);
        }
        .meta {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .tag {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            padding: 0.35rem 0.6rem;
            border-radius: 999px;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .spinner {
            margin: 1.25rem auto 0;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: conic-gradient(var(--accent), transparent 40%);
            animation: spin 1.5s linear infinite;
            box-shadow: 0 6px 24px rgba(125,211,252,0.08);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        footer {
            margin-top: 1.25rem;
            color: var(--muted);
            font-size: 0.85rem;
        }
        a { color: var(--accent); text-decoration: none; }
        @media (max-width:420px) {
            h1 { font-size: 1.5rem; }
            .card { padding: 1.25rem; border-radius: 10px; }
        }
    </style>
</head>
<body>
    <main class="center" role="main">
        <section class="card" aria-labelledby="title">
            <h1 id="title">Under Construction</h1>
            <p class="lead" aria-live="polite">We're building something great. Please check back soon.</p>

            <div class="meta" aria-hidden="true">
                <span class="tag">Status: In progress</span>
                <span class="tag">ETA: Coming soon</span>
            </div>

            <div class="spinner" aria-hidden="true"></div>

        </section>
    </main>
</body>
</html>
